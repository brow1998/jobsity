name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: docker compose up -d --wait kafka clickhouse
      - name: The one documented command
        run: docker compose run --rm pipeline
      - name: End-to-end tests (sends the sample twice, expects each trip once)
        run: uv run pytest -m e2e
      - if: failure()
        run: docker compose logs
